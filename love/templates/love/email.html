<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Une réponse pour notre date</title>
</head>
<body style="margin:0;padding:0;background:#080508;font-family:Arial,Helvetica,sans-serif;color:#fff;">
  <div style="padding:45px 18px;background:#080508;">
    <div style="max-width:620px;margin:auto;background:#100a0f;border:1px solid #392330;overflow:hidden;">

      <div style="padding:42px 38px;background:linear-gradient(135deg,#160b12,#080508);border-bottom:1px solid #392330;">
        <div style="font-size:11px;letter-spacing:4px;color:#ff2f86;margin-bottom:22px;">
          LA REPONSE 
        </div>
        <div style="font-family:Georgia,serif;font-size:48px;line-height:1;color:#fff;">
          Alors...<br>
          <span style="color:#ff2f86;font-style:italic;">on date quand ?</span>
        </div>
      </div>

      <div style="padding:38px;">
        <div style="font-size:10px;letter-spacing:3px;color:#8f7c88;margin-bottom:12px;">
          RENDEZ-VOUS
        </div>
        <div style="font-family:Georgia,serif;font-size:29px;color:#fff;margin-bottom:34px;">
          {{ choice }}
        </div>

        <div style="font-size:10px;letter-spacing:3px;color:#8f7c88;margin-bottom:12px;">
          LA DATE
        </div>
        <div style="font-family:Georgia,serif;font-size:29px;color:#ff5da2;margin-bottom:34px;">
          {{ date_text }}
        </div>

        <div style="height:1px;background:#392330;margin:8px 0 32px;"></div>

        <div style="font-size:10px;letter-spacing:3px;color:#8f7c88;margin-bottom:14px;">
          SON PETIT MOT
        </div>
        <div style="padding:24px;background:#170d14;border-left:3px solid #ff2f86;color:#e9dfe5;font-family:Georgia,serif;font-size:18px;line-height:1.7;font-style:italic;">
          {{ message|linebreaksbr }}
        </div>
      </div>

      <div style="padding:24px 38px;border-top:1px solid #392330;color:#665660;font-size:9px;letter-spacing:2px;text-align:center;">
        UNE PROPOSITION • RIEN QUE POUR NOUS
      </div>
    </div>
  </div>
</body>
</html>
